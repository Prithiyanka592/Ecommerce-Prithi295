<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Ecommerce-Prithi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f3f3f3; }
        .header { background: #131921; color: white; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #febd69; }
        .nav a { color: white; text-decoration: none; margin-left: 18px; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        h1 { margin-bottom: 25px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; }
        .product-card { background: white; border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; transition: 0.25s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
        .product-card img { width: 100%; height: 170px; object-fit: contain; margin-bottom: 12px; }
        .product-card h3 { font-size: 16px; margin-bottom: 8px; height: 40px; }
        .price { color: #b12704; font-size: 18px; font-weight: bold; margin: 8px 0; }
        .btn { background: #ffd814; border: none; padding: 9px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn:hover { background: #f7ca00; }
        .footer { background: #131921; color: #ddd; text-align: center; padding: 20px; margin-top: 50px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Ecommerce-Prithi</div>
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="price-alert.html">Price Alert</a>
            <a href="orders.html">Orders</a>
            <a href="login.html">Login</a>
        </div>
    </div>

    <div class="container">
        <h1>All Products</h1>
        <div class="products-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=300&h=300&fit=crop" alt="Mouse">
                <h3>Wireless Mouse</h3>
                <div class="price">₹499</div>
                <button class="btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300&h=300&fit=crop" alt="T-Shirt">
                <h3>Cotton T-Shirt</h3>
                <div class="price">₹299</div>
                <button class="btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300&h=300&fit=crop" alt="Notebook">
                <h3>Notebook Set</h3>
                <div class="price">₹199</div>
                <button class="btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300&h=300&fit=crop" alt="Headphones">
                <h3>Bluetooth Headphones</h3>
                <div class="price">₹1999</div>
                <button class="btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=300&h=300&fit=crop" alt="Bottle">
                <h3>Water Bottle</h3>
                <div class="price">₹349</div>
                <button class="btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=300&h=300&fit=crop" alt="Keyboard">
                <h3>Mechanical Keyboard</h3>
                <div class="price">₹2499</div>
                <button class="btn">Add to Cart</button>
            </div>
        </div>
    </div>

    <div class="footer">© 2026 Ecommerce-Prithi | Academic Project</div>
</body>
</html>
