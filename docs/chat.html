<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support | Ecommerce-Prithi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f3f3f3; }
        .header { background: #131921; color: white; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #febd69; }
        .nav a { color: white; text-decoration: none; margin-left: 18px; }
        .chat-box { max-width: 600px; margin: 40px auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .chat-header { background: #232f3e; color: white; padding: 16px 20px; font-weight: bold; }
        .chat-body { padding: 20px; min-height: 320px; }
        .message { margin-bottom: 15px; padding: 12px 16px; border-radius: 12px; max-width: 80%; }
        .bot { background: #f1f1f1; }
        .user { background: #e3f2fd; margin-left: auto; text-align: right; }
        .chat-input { display: flex; border-top: 1px solid #eee; }
        .chat-input input { flex: 1; padding: 15px; border: none; outline: none; }
        .chat-input button { padding: 15px 25px; background: #febd69; border: none; font-weight: bold; cursor: pointer; }
        .footer { background: #131921; color: #ddd; text-align: center; padding: 20px; margin-top: 50px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Ecommerce-Prithi</div>
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="chat.html">Support</a>
            <a href="login.html">Login</a>
        </div>
    </div>

    <div class="chat-box">
        <div class="chat-header">AI Chat Support</div>
        <div class="chat-body">
            <div class="message bot">
                <strong>Bot:</strong> Hello! Ask me about products, orders, delivery or returns.
            </div>
        </div>
        <div class="chat-input">
            <input type="text" placeholder="Type your question...">
            <button>Send</button>
        </div>
    </div>

    <div class="footer">© 2026 Ecommerce-Prithi | Academic Project</div>
</body>
</html>
